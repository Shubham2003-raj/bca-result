<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Result</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background-color: #f7f7f7;
    }
    .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

<h2 id="semesterTitle">BCA Examination Result</h2>


    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        padding: 10px 20px;
        border: none;
        background-color: #4CAF50;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }
    .result {
        margin-top: 20px;
        display: none;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    table, th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
    }
    th {
        background-color: #f2f2f2;
    }
</style>
</head>
<body>

<div style="text-align:center; margin-bottom:10px;">
    <img src="logo.png" alt="University Logo" style="height:50px; vertical-align:middle; margin-right:10px;">

    <span style="text-transform:uppercase; font-size:35px; font-weight:bold; vertical-align:middle;">
        Aryabhatta Knowledge University
    </span>
</div>

<h2 id="semesterTitle">BCA Examination Result</h2>
    <label for="semester">Select Semester:</label>

<select id="semester">
    <option value="sem1">1st Semester</option>
    <option value="sem2">2nd Semester</option>
</select>

<br><br>
    <label for="rollNumber">Enter Roll Number:</label>
    <input type="text" id="rollNumber">
    <button onclick="showResult()">View Result</button>

   <div class="result" id="resultDiv"></div>

<script>

const results = {

    sem1: {
        roll: "24303302129",
        studentName: "SHUBHAM RAJ",
        fatherName: "SARVJEET KUMAR",
        motherName: "MANORMA DEVI",
        college: "DIGHA, PATNA",
        course: "BACHELOR OF COMPUTER APPLICATION",
        sgpa: "7.79",
        remarks: "Pass",

        subjects: [
            ["COMMUNICATIVE ENGLISH",25,37,62,"B",4],
            ["BASIC MATHEMATICS",23,40,63,"C",5],
            ["INFORMATION TECHNOLOGY & APPLICATION",20,46,66,"C",4],
            ["IT PRACTICAL",20,25,45,"A+",2],
            ["PRINCIPLES OF MANAGEMENT & ORGANIZATION",20,52,72,"B",5],
            ["PYTHON PROGRAMMING",11,34,45,"P",2]
        ]
    },

    sem2: {
        roll: "24303302129",
        studentName: "SHUBHAM RAJ",
        fatherName: "SARVJEET KUMAR",
        motherName: "MANORMA DEVI",
        college: "DIGHA, PATNA",
        course: "BACHELOR OF COMPUTER APPLICATION",
        sgpa: "8.10",
        remarks: "Pass",

        subjects: [
            ["DATA STRUCTURE",24,45,69,"B",5],
            ["DBMS",22,40,62,"B",5],
            ["OPERATING SYSTEM",20,42,62,"B",4],
            ["OS PRACTICAL",23,25,48,"A+",2],
            ["DIGITAL LOGIC",21,39,60,"B",4],
            ["C PROGRAMMING",25,50,75,"A",5]
        ]
    }

};

function showResult() {

    const rollNumber = document.getElementById('rollNumber').value;

    const semester = document.getElementById('semester').value;

    const resultDiv = document.getElementById('resultDiv');

    const data = results[semester];

    if (rollNumber === data.roll) {

        document.getElementById('semesterTitle').innerText =
            semester === "sem1"
            ? "BCA 1st Semester Examination Result 2024"
            : "BCA 2nd Semester Examination Result 2025";

        let subjectRows = "";

        data.subjects.forEach(sub => {

            subjectRows += `
            <tr>
                <td>${sub[0]}</td>
                <td>${sub[1]}</td>
                <td>${sub[2]}</td>
                <td>${sub[3]}</td>
                <td>${sub[4]}</td>
                <td>${sub[5]}</td>
            </tr>
            `;
        });

        resultDiv.innerHTML = `

        <h3>Student Details</h3>

        <p><strong>Student Name:</strong> ${data.studentName}</p>

        <p><strong>Father's Name:</strong> ${data.fatherName}</p>

        <p><strong>Mother's Name:</strong> ${data.motherName}</p>

        <p><strong>College:</strong> ${data.college}</p>

        <p><strong>Course:</strong> ${data.course}</p>

        <h3>Subject Wise Marks</h3>

        <table>
            <tr>
                <th>Subject Name</th>
                <th>IA</th>
                <th>ESE</th>
                <th>Total</th>
                <th>Grade</th>
                <th>Credit</th>
            </tr>

            ${subjectRows}

        </table>

        <p><strong>SGPA:</strong> ${data.sgpa}</p>

        <p><strong>Remarks:</strong> ${data.remarks}</p>

        `;

        resultDiv.style.display = 'block';

    } else {

        alert("Result not found.");

        resultDiv.style.display = 'none';
    }
}

</script>

</body>
</html>
